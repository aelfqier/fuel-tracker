<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- bnzn: an amber fuel drop under an efficiency dial, on graphite. Rendered to icon-only.png for npx capacitor-assets generate. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%"><stop offset="0" stop-color="#2a2620"/><stop offset=".55" stop-color="#16181c"/><stop offset="1" stop-color="#0b0c0f"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="38%"><stop offset="0" stop-color="#ff8a1f" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="210" y1="0" x2="814" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3ddc84"/><stop offset=".45" stop-color="#ffc53d"/><stop offset=".75" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ff4d4d"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc35a"/><stop offset=".55" stop-color="#ff8a1f"/><stop offset="1" stop-color="#f05f0c"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="600" r="360" fill="url(#glow)"/>
  <g id="mark">
    <path d="M247.4 712.8 A 302 302 0 1 1 776.6 712.8" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="58" stroke-linecap="round"/>
    <path d="M247.4 712.8 A 302 302 0 0 1 512 258" fill="none" stroke="url(#arc)" stroke-width="58" stroke-linecap="round"/>
    <path d="M247.4 712.8 A 302 302 0 0 1 512 258" fill="none" stroke="url(#arc)" stroke-width="58" stroke-linecap="round" filter="url(#soft)" opacity=".7"/>
    <circle cx="512" cy="258" r="40" fill="#fff" stroke="#ffb547" stroke-width="16"/>
    <path d="M512 400 C 512 400 404 528 404 610 A 108 108 0 0 0 620 610 C 620 528 512 400 512 400 Z" fill="url(#drop)"/>
    <path d="M470 600 a 46 46 0 0 0 30 52" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
