name: Store builds

# Run it from the Actions tab ("Store builds" > "Run workflow") to get:
#   - Android: a signed .aab to upload in the Google Play Console (download it from the run's Artifacts)
#   - iOS: a build sent straight to App Store Connect / TestFlight
# The secrets it needs are listed in store/README.md. Without them it still checks that both apps compile.
# On pull requests it only checks that both release builds compile; nothing is uploaded.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android (Google Play)
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
      - name: Read the version from package.json
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Unpack the upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the release bundle and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease
      - name: Collect the files
        run: |
          mkdir -p out
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/fuel-tracker-$VERSION_NAME-$VERSION_CODE.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "out/fuel-tracker-$VERSION_NAME-$VERSION_CODE.apk"
            echo "### Android $VERSION_NAME (version code $VERSION_CODE) is signed and ready for Google Play" >> "$GITHUB_STEP_SUMMARY"
          else
            cp android/app/build/outputs/bundle/release/app-release.aab "out/fuel-tracker-$VERSION_NAME-$VERSION_CODE-unsigned.aab"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the bundle is unsigned and Google Play will refuse it."
            echo "### Android $VERSION_NAME (version code $VERSION_CODE) built, but unsigned: add the upload key secrets" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-google-play
          path: out/

  ios:
    name: iOS (App Store)
    runs-on: macos-26
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # Uploads happen only from a manual run with the App Store Connect key in place.
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && secrets.APPSTORE_API_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Sync the web app and install CocoaPods
        run: npx cap sync ios
      - name: Read the version from package.json
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "Built with $(xcodebuild -version | head -n 1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive
        run: |
          # The archive is left unsigned; the export below signs it with Apple's cloud-managed distribution certificate.
          xcodebuild -quiet -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO archive
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
      - name: Sign and upload to App Store Connect
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY_PATH"
          echo "### iOS $VERSION_NAME (build $BUILD_NUMBER) was sent to App Store Connect. It shows in TestFlight after Apple finishes processing it." >> "$GITHUB_STEP_SUMMARY"
      - name: Note that nothing was uploaded
        if: env.UPLOAD != 'true'
        run: echo "### iOS $VERSION_NAME (build $BUILD_NUMBER) compiles. Nothing was uploaded (run it manually with the App Store Connect secrets to upload)." >> "$GITHUB_STEP_SUMMARY"
