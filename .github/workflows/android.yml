name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk fuel-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fuel-tracker-apk
          path: fuel-tracker.apk
      # Publish the APK as the "latest" release so it has a direct download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/fuel-tracker.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest fuel-tracker.apk \
            --title "Fuel Tracker (latest build)" \
            --notes "Android test build from commit ${GITHUB_SHA::7}. Download fuel-tracker.apk on your phone and open it to install." \
            --latest
